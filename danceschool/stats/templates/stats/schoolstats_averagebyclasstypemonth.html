{% load sekizai_tags static i18n %}

<h3 class="mt-4">{% trans "Performance by Class Type and Month (Student-Hours)" %}</h3>

<div class="card">

  <div class="card-header">
    <ul class="nav nav-tabs card-header-tabs">
      {% for prior_year in recentYears reversed %}
        <li class="nav-item">
          <a href="#" data-year="{{ prior_year }}" class="nav-link classTypeMonthlyButton {% if forloop.first %}active{% endif %}">{{ prior_year }}</a>
        </li>
      {% endfor %}
    </ul>
  </div>
  <div class="card-body">
    <canvas id="ClassTypeMonthlyPerformance" style="max-height:400px;"></canvas>
  </div>

</div>

{% addtoblock "js" %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
{% endaddtoblock %}
{% addtoblock "js" %}
<script type="text/javascript">
(function () {
  'use strict';

  var classTypeMonthlyChart = null;

  function buildClassTypeMonthlyChart(data) {
    // Separate out the Totals row for sorting
    var totalsRow = null;
    var rows = data.filter(function (d) {
      if (d.month === 'Totals') { totalsRow = d; return false; }
      return true;
    });

    if (!rows.length) return;

    var typeKeys = Object.keys(rows[0]).filter(function (k) {
      return k !== 'month' && k !== 'month_name';
    });

    // Sort class types by descending annual total
    if (totalsRow) {
      typeKeys.sort(function (a, b) {
        return (totalsRow[b] || 0) - (totalsRow[a] || 0);
      });
    }

    var labels = rows.map(function (d) { return d.month_name; });
    var datasets = typeKeys.map(function (key) {
      return {
        label: key,
        data: rows.map(function (d) { return d[key] != null ? d[key] : 0; }),
        stack: 'stack',
      };
    });

    var ctx = document.getElementById('ClassTypeMonthlyPerformance');
    if (classTypeMonthlyChart) { classTypeMonthlyChart.destroy(); }
    classTypeMonthlyChart = new Chart(ctx, {
      type: 'bar',
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom' } },
        scales: {
          x: { stacked: true },
          y: { stacked: true, beginAtZero: true },
        },
      },
    });
  }

  function loadClassTypeMonthlyChart(year) {
    var url = '{% url "ClassTypeMonthlyJSON" %}?typeLimit=4&series=studenthours';
    if (year) { url += '&year=' + year; }
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (data) { buildClassTypeMonthlyChart(data); });
  }

  var initialBtn = document.querySelector('.classTypeMonthlyButton.active');
  loadClassTypeMonthlyChart(initialBtn ? initialBtn.dataset.year : '');

  document.querySelectorAll('.classTypeMonthlyButton').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      loadClassTypeMonthlyChart(btn.dataset.year);
      document.querySelectorAll('.classTypeMonthlyButton').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
    });
  });

}());
</script>
{% endaddtoblock %}
