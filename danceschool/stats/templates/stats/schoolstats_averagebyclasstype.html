{% load sekizai_tags static i18n %}

<h3 class="mt-4">{% trans "Performance by Class Type" %}
  <a class="btn btn-sm btn-outline-secondary" href="{% url 'AveragesByClassTypeCSV' %}">{% trans "Download Data" %}</a>
</h3>

<div class="card">

  <div class="card-header">
    <ul class="nav nav-tabs card-header-tabs">
      <li class="nav-item">
        <a href="#" class="nav-link active classTypeButton" data-start-date="{{ limitMonthDates.12 }}">{% trans "Last 12 Months" %}</a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link classTypeButton" data-start-date="">{% trans "All Time" %}</a>
      </li>
    </ul>
  </div>

  <div class="card-body">
    <canvas id="ClassTypePerformance" style="max-height:400px;"></canvas>
  </div>

</div>

{% addtoblock "js" %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
{% endaddtoblock %}
{% addtoblock "js" %}
<script type="text/javascript">
(function () {
  'use strict';

  var classTypeChart = null;
  var SHOW_DEFAULT = '{% trans "Average Registrations" %}';

  function buildClassTypeChart(data) {
    if (!data.length) return;

    var labels = data.map(function (d) { return d.type; });
    var keys = Object.keys(data[0]).filter(function (k) { return k !== 'type'; });

    var datasets = keys.map(function (key) {
      return {
        label: key,
        data: data.map(function (d) { return d[key] != null ? d[key] : null; }),
        hidden: key !== SHOW_DEFAULT,
      };
    });

    var ctx = document.getElementById('ClassTypePerformance');
    if (classTypeChart) { classTypeChart.destroy(); }
    classTypeChart = new Chart(ctx, {
      type: 'bar',
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom' } },
        scales: { y: { beginAtZero: true } },
      },
    });
  }

  function loadClassTypeChart(startDate) {
    var url = '{% url "AveragesByClassTypeJSON" %}';
    if (startDate) { url += '?startDate=' + startDate; }
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (data) { buildClassTypeChart(data); });
  }

  loadClassTypeChart('{{ limitMonthDates.12 }}');

  document.querySelectorAll('.classTypeButton').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      loadClassTypeChart(btn.dataset.startDate);
      document.querySelectorAll('.classTypeButton').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
    });
  });

}());
</script>
{% endaddtoblock %}
