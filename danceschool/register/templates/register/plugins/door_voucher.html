{% load i18n %}

<div class="col-12 my-1">
<div class="card">
    <div class="card-header">{% trans "Enter voucher code" %}</div>
    <div class="card-body item">
        <div class="voucherDetail d-flex gap-2 align-items-center">
            <label for="id_gift" class="visually-hidden">{% trans "Voucher ID" %}</label>
            <input type="text" class="form-control" name="gift" id="id_gift">
            <button class="btn btn-outline-primary add-voucher" >{% trans "Add Voucher" %}</button>
        </div>
    </div>
</div>
</div>
