{% load i18n %}

<form id="stripeCertificateForm" action="{% url 'stripeSession' %}" method="POST" class="my-4">
{% csrf_token %}
<p><input id="id_amount" name="stripeAmount" type="number" min="1" step="0.01" value="{{ instance.defaultAmount }}" /></p>

{# The success page is looked up from this plugin on the server. #}
<input type="hidden" name="plugin_id" value="{{ instance.id }}">
<input type="hidden" name="sourceUrl" value="{{ request.get_full_path }}">
<input type="hidden" name="transaction_type" value="Gift Certificate">

<input id="stripeSubmitButton" type="submit" value="{% trans 'Pay with Card' %}" class="btn btn-primary" />

</form>
